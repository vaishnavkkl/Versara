plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.pdfengine'
version = '0.1.0'

dependencies {
  implementation 'com.tom-roush:pdfbox-android:2.0.27.0'
}

android {
  namespace "expo.modules.pdfengine"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
    externalNativeBuild { cmake { cppFlags '-std=c++17 -fexceptions -frtti' } }
  }
  externalNativeBuild { cmake { path 'CMakeLists.txt'; version '3.22.1' } }
  sourceSets.main.assets.srcDir '../vendor/android-assets'
  lintOptions {
    abortOnError false
  }
}
