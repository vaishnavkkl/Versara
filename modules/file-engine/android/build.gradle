plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.fileengine'
version = '0.1.0'

android {
  namespace "expo.modules.fileengine"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
  lintOptions {
    abortOnError false
  }
}

dependencies {
  // Reuse the PDF engine's FOSS recognizer and packaged tessdata/eng.traineddata.
  // Recognition never downloads models or initializes Google SDK telemetry.
  implementation 'cz.adaptech.tesseract4android:tesseract4android:4.9.0'
}
